version: '3.8'

services:
  mysql:
    build: .
    container_name: deliver_eats_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: auth_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./model.sql:/docker-entrypoint-initdb.d/model.sql
    networks:
      - deliver_eats_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local

networks:
  deliver_eats_network:
    driver: bridge
