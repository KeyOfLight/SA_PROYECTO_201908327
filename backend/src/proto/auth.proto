syntax = "proto3";

package auth;

// Mensajes de request y response

message LoginRequest {
  string email = 1;
  string password = 2;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string role = 3;
}

message User {
  int32 id = 1;
  string email = 2;
  string role = 3;
}

message AuthResponse {
  bool success = 1;
  string message = 2;
  string token = 3;
  User user = 4;
}

message GetMeRequest {
  int32 user_id = 1;
}

message UpdateProfileRequest {
  int32 user_id = 1;
  string email = 2;
  string role = 3;
}

message ChangePasswordRequest {
  int32 user_id = 1;
  string current_password = 2;
  string new_password = 3;
}

message SimpleResponse {
  bool success = 1;
  string message = 2;
}

// Servicio de Autenticación
service AuthService {
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc GetMe(GetMeRequest) returns (AuthResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (AuthResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (SimpleResponse);
}
