<div class="register-container">
	<div class="register-box">
		<h1 class="register-title">Deliver Eats</h1>
		<p class="register-subtitle">Crea tu cuenta</p>

		<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
			<!-- Email -->
			<div class="form-group">
				<label for="email" class="form-label">Email</label>
				<input
					type="email"
					id="email"
					class="form-control"
					formControlName="email"
					placeholder="tu@email.com"
					[class.is-invalid]="submitted && f['email'].errors"
				/>
				<div class="error-message" *ngIf="submitted && f['email'].errors">
					<span *ngIf="f['email'].errors['required']">El email es requerido</span>
					<span *ngIf="f['email'].errors['email']">Ingresa un email válido</span>
				</div>
			</div>

			<!-- Password -->
			<div class="form-group">
				<label for="password" class="form-label">Contraseña</label>
				<input
					type="password"
					id="password"
					class="form-control"
					formControlName="password"
					placeholder="••••••••"
					[class.is-invalid]="submitted && f['password'].errors"
				/>
				<div class="error-message" *ngIf="submitted && f['password'].errors">
					<span *ngIf="f['password'].errors['required']">La contraseña es requerida</span>
					<span *ngIf="f['password'].errors['minlength']">Mínimo 6 caracteres</span>
				</div>
			</div>

			<!-- Confirm Password -->
			<div class="form-group">
				<label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
				<input
					type="password"
					id="confirmPassword"
					class="form-control"
					formControlName="confirmPassword"
					placeholder="••••••••"
					[class.is-invalid]="submitted && f['confirmPassword'].errors"
				/>
				<div class="error-message" *ngIf="submitted && f['confirmPassword'].errors">
					<span *ngIf="f['confirmPassword'].errors['required']">Confirma tu contraseña</span>
				</div>
				<div class="error-message" *ngIf="submitted && registerForm.errors?.['passwordMismatch']">
					<span>Las contraseñas no coinciden</span>
				</div>
			</div>

			<!-- Role Selection -->
			<div class="form-group">
				<label for="role" class="form-label">Tipo de Usuario</label>
				<select
					id="role"
					class="form-control"
					formControlName="role"
					[class.is-invalid]="submitted && f['role'].errors"
				>
					<option value="">Selecciona un rol</option>
					<option value="CLIENTE">Cliente</option>
					<option value="REPARTIDOR">Repartidor</option>
					<option value="RESTAURANTE">Restaurante</option>
				</select>
				<div class="error-message" *ngIf="submitted && f['role'].errors">
					<span *ngIf="f['role'].errors['required']">Selecciona un tipo de usuario</span>
				</div>
			</div>

			<!-- Error Message -->
			<div class="alert alert-error" *ngIf="error">
				{{ error }}
			</div>

			<!-- Success Message -->
			<div class="alert alert-success" *ngIf="success">
				{{ success }}
			</div>

			<!-- Buttons -->
			<div class="button-group">
				<button
					type="submit"
					class="btn btn-primary"
					[disabled]="loading"
				>
					{{ loading ? 'Registrando...' : 'Registrarse' }}
				</button>
				<button
					type="button"
					class="btn btn-secondary"
					(click)="resetForm()"
					[disabled]="loading"
				>
					Limpiar
				</button>
			</div>
		</form>

		<!-- Link to Login -->
		<div class="register-footer">
			<p>¿Ya tienes cuenta? <a routerLink="/login" class="login-link">Inicia sesión</a></p>
		</div>
	</div>
</div>
<p>register works!</p>
